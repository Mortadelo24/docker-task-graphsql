name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with: 
        fetch-depth: 0
    - name: Docker login
      env:
        DOCKER_USER: ${{ secrets.TOKEN_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: | 
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
    - name: Build docker image
      run: |
        docker build -t haterofvectors/docker-graph-sql:0.0.2 .
        docker build -t haterofvectors/docker-graph-sql:latest .
    - name: push image
      run: |
        docker push haterofvectors/docker-graph-sql:0.0.2
        docker push haterofvectors/docker-graph-sql:latest
    #- name: Build the Docker image
     # run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
